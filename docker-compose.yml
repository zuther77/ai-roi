# Docker Compose is the single entry point for everything that runs on the
# master (design spec Section 1.5). Today it holds exactly one service, but
# this is the shape the rest of the project slots into: Postgres and Redis
# become siblings of `playout` in Sprints 2 and 3, and in production one
# systemd unit does nothing but run `docker compose up -d` against this file.
#
# There is no `version:` key — it was deprecated by Compose and current
# versions warn if you include it.

services:
  # The playout service: reads an audio file, pairs it with a still image,
  # encodes both, and pushes the result to YouTube over RTMP.
  playout:
    # Build from ./playout/Dockerfile rather than pulling a prebuilt image,
    # since we need ffmpeg baked in alongside our own script.
    build: ./playout

    # Loads .env into the container's environment. This is what makes
    # YOUTUBE_STREAM_KEY readable by stream.sh at runtime.
    #
    # Worth being precise about, because Compose uses .env for two unrelated
    # things: this line injects the variables into the *container*, while
    # Compose separately reads the same file to substitute ${VARIABLES} inside
    # this YAML. Only the first matters here.
    #
    # The key is never written into this file, which is committed. It stays in
    # .env, which is gitignored.
    env_file: .env
    # In-network Postgres URL. Overrides a host-oriented DATABASE_URL in .env.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      QUEUE_DIR: /app/queue
    depends_on:
      - postgres

    # Day 3: Compose restarts the container if it exits for any reason other
    # than an explicit `docker compose stop/down`. This is the crash-recovery
    # mechanism that works identically on macOS and Linux — no OS supervisor
    # for the app itself.
    #
    # Note: Compose has no RestartSec. A genuine crash-loop can hammer CPU and
    # logs. The entrypoint sleeps a couple of seconds before starting to blunt
    # that (see playout/entrypoint.sh).
    restart: always

    volumes:
      # Mount the host's test-assets directory into the container, read-only.
      #
      # Mounting rather than COPYing into the image means you can swap the
      # audio file and restart, with no rebuild. `:ro` is deliberate: playout
      # only ever reads these files, so the container has no business writing
      # to your working tree.
      #
      # Day 2 no longer streams from here — the filler pool below supplies the
      # audio — but image.jpg is still the video layer, so the mount stays.
      - ./test-assets:/app/test-assets:ro

      # The filler pool (Day 2). Writable, unlike test-assets, because three
      # things inside it are written at runtime:
      #   audio/             your tracks (read only in practice)
      #   filler.db          the SQLite metadata store
      #   current_track.txt  the "now playing" file
      # Keeping the database on a mounted volume rather than inside the
      # container means play counts and history survive a rebuild, which is
      # what Day 3's crash-recovery testing depends on.
      - ./filler-pool:/app/filler-pool

      # Day 3 structured logs, readable from the host on either OS.
      - ./logs:/app/logs

      # Day 8 queue store + generated tracks. TRACKS_HOST_DIR on the Linux
      # master is /srv/radio/tracks (the NFS export). Elsewhere it is ./tracks.
      - ./queue:/app/queue:ro
      - ${TRACKS_HOST_DIR:-./tracks}:/srv/radio/tracks:ro

  # ─────────────────────────────────────────────────────────────────────────
  # Day 4 — Redis: the shared job queue between master and the Windows worker
  # (design spec Section 3.5; detailed-plan Day 4). A Compose service, not a
  # native install — the master stays 100% containerized (working rule 4).
  redis:
    image: redis:7-alpine

    # Password from .env — never a passwordless Redis, even on the private
    # direct-link subnet (Day 4 pitfall). Passed via the container
    # environment and expanded by the shell inside the container, so the
    # value never appears in this committed file or in `docker compose top`
    # argv (the Day 2 stream-key lesson).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'

    # Published on specific interfaces — never 0.0.0.0 (spec v0.4.1):
    #   * LAN/Wi-Fi (192.168.1.210) — the normative worker network since
    #     the 2026-10-04 owner decision: EVERY worker, any OS, reaches
    #     Redis here. requirepass is mandatory; reachable-from-LAN is by
    #     design (see design-spec Section 3.5 networking).
    #   * Legacy direct link (192.168.50.1) — NIC still configured; kept
    #     until the link is physically retired.
    # Binding fails if an interface is down — deliberate, not a bug.
    # REDIS_BIND exists so a fresh clone can bring the stack up on a machine
    # that is not this master (set it to 127.0.0.1, or 0.0.0.0 to serve any
    # interface). The default is the master's static LAN address, so leaving
    # it unset keeps the existing deployment behaviour exactly.
    ports:
      - "${REDIS_BIND:-192.168.1.210}:6379:6379"

    # Day 6: queue persistence. appendonly + a named volume so pending and
    # in-progress jobs survive a Redis restart (the Day 4 skeleton accepted
    # that loss; Day 6's failure-safety goal does not).
    volumes:
      - redis-data:/data
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # Day 6 — queue-reaper: job-lease enforcement + generation-stats recorder
  # (detailed-plan Day 6). Runs on the master, deliberately independent of
  # the workers' network — a dead or disconnected worker cannot leave a job stuck
  # in jobs:in_progress forever, because lease expiry is decided here.
  # restart: always per the plan's pitfall: never a one-off script.
  queue-reaper:
    image: python:3.12-slim
    env_file: .env
    environment:
      # In-network address; .env's REDIS_URL is the LAN one the workers use.
      REDIS_URL: redis://redis:6379/0
      STATS_DB: /app/queue/generation_stats.db
    volumes:
      - ./queue:/app/queue
    command: ["python", "/app/queue/reaper.py"]
    restart: always
    depends_on:
      - redis

  # Day 8 — Postgres. Not published on the LAN. Playout and the queue
  # manager reach it on the Compose network.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-radio}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  queue-manager:
    build: ./queue
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      TRACKS_DIR: /srv/radio/tracks
    volumes:
      - ./queue:/app/queue
    restart: always
    depends_on:
      - redis
      - postgres

  # Day 14 — provider-worker (Option B). Makes paid providers participate in
  # the same pull-based Redis job protocol as the local workers. Runs on the
  # master by default (the provider key is already here — no new secret
  # exposure; see TRADE_OFF.md). stdlib only, so it reuses python:3.12-slim
  # with no build. It exits cleanly (idle) when neither provider key is set,
  # so a local_only deployment can leave it enabled harmlessly. Unlike playout
  # it WRITES generated tracks, so the tracks mount is read-write here.
  provider-worker:
    image: python:3.12-slim
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TRACKS_DIR: /srv/radio/tracks
    volumes:
      - ./worker:/app/worker
      - ${TRACKS_HOST_DIR:-./tracks}:/srv/radio/tracks
    working_dir: /app/worker
    command: ["python", "-u", "/app/worker/provider_worker.py"]
    restart: always
    depends_on:
      - redis

  # Day 16 — YouTube Live Chat intake: the PUBLIC prompt path. Viewers type
  # `!request <prompt>` in the stream's chat; this polls the chat and calls the
  # same submit_prompt() the operator form uses. Publishes no port. With
  # YOUTUBE_DATA_API_KEY / YOUTUBE_VIDEO_ID unset it idles (no crash-loop), so
  # a deployment without YouTube chat is unaffected. Needs OPENAI_API_KEY like
  # the form (never accepts un-screened text).
  chat-intake:
    build: ./queue
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./queue:/app/queue:ro
    command: ["python", "-u", "/app/queue/chat_intake.py"]
    restart: always
    depends_on:
      - postgres
      - redis

  # Day 17 — status dashboard. READ-ONLY: it only reads Postgres, Redis, the
  # stats db, the playout log and the filler/tracks dirs, and writes nothing.
  # NO AUTHENTICATION, so it is published on LOCALHOST ONLY by default
  # (STATUS_BIND); set it to the master's LAN address only on a network you
  # trust. Open http://127.0.0.1:8081 ON the master. It is an operator
  # convenience, not part of the stream: if it dies, nothing else is affected.
  status:
    build: ./queue
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      REDIS_URL: redis://redis:6379/0
      STATUS_PORT: "8081"
      STATS_DB: /app/queue/generation_stats.db
      PLAYOUT_LOG: /app/logs/playout.jsonl
      FILLER_DIR: /app/filler-pool
      TRACKS_DIR: /srv/radio/tracks
    ports:
      - "${STATUS_BIND:-127.0.0.1}:8081:8081"
    volumes:
      - ./queue:/app/queue:ro
      - ./logs:/app/logs:ro
      - ./filler-pool:/app/filler-pool:ro
      - ${TRACKS_HOST_DIR:-./tracks}:/srv/radio/tracks:ro
    command: ["python", "-u", "/app/queue/status.py"]
    restart: always
    depends_on:
      - postgres
      - redis

  # Day 10 — operator prompt form. Same image as the queue manager. Serves the
  # page and POST /prompts. Does not generate.
  # Day 16: this is an operator/testing tool, NOT the public path (that is
  # chat-intake above). Published on LOCALHOST ONLY by default (owner decision
  # 2026-10-20). To reach it from another machine on purpose, set
  # INTAKE_BIND=<master LAN address> in .env.
  intake:
    build: ./queue
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      INTAKE_PORT: "8080"
      # Day 12: rate limiting shares the master's Redis (in-network address;
      # REDIS_PASSWORD comes from .env via env_file).
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${INTAKE_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./queue:/app/queue:ro
    command: ["python", "-u", "/app/queue/intake.py"]
    restart: always
    depends_on:
      - postgres
      - redis

# Named volumes for Compose services (Day 6: Redis persistence).
volumes:
  redis-data:
  pg-data:
