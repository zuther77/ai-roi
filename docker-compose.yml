# Docker Compose is the single entry point for everything that runs on the
# master (design spec Section 1.5). Today it holds exactly one service, but
# this is the shape the rest of the project slots into: Postgres and Redis
# become siblings of `playout` in Sprints 2 and 3, and in production one
# systemd unit does nothing but run `docker compose up -d` against this file.
#
# There is no `version:` key — it was deprecated by Compose and current
# versions warn if you include it.

services:
  # The playout service: reads an audio file, pairs it with a still image,
  # encodes both, and pushes the result to YouTube over RTMP.
  playout:
    # Build from ./playout/Dockerfile rather than pulling a prebuilt image,
    # since we need ffmpeg baked in alongside our own script.
    build: ./playout

    # Loads .env into the container's environment. This is what makes
    # YOUTUBE_STREAM_KEY readable by stream.sh at runtime.
    #
    # Worth being precise about, because Compose uses .env for two unrelated
    # things: this line injects the variables into the *container*, while
    # Compose separately reads the same file to substitute ${VARIABLES} inside
    # this YAML. Only the first matters here.
    #
    # The key is never written into this file, which is committed. It stays in
    # .env, which is gitignored.
    env_file: .env

    # Day 3: Compose restarts the container if it exits for any reason other
    # than an explicit `docker compose stop/down`. This is the crash-recovery
    # mechanism that works identically on macOS and Linux — no OS supervisor
    # for the app itself.
    #
    # Note: Compose has no RestartSec. A genuine crash-loop can hammer CPU and
    # logs. The entrypoint sleeps a couple of seconds before starting to blunt
    # that (see playout/entrypoint.sh).
    restart: always

    volumes:
      # Mount the host's test-assets directory into the container, read-only.
      #
      # Mounting rather than COPYing into the image means you can swap the
      # audio file and restart, with no rebuild. `:ro` is deliberate: playout
      # only ever reads these files, so the container has no business writing
      # to your working tree.
      #
      # Day 2 no longer streams from here — the filler pool below supplies the
      # audio — but image.jpg is still the video layer, so the mount stays.
      - ./test-assets:/app/test-assets:ro

      # The filler pool (Day 2). Writable, unlike test-assets, because three
      # things inside it are written at runtime:
      #   audio/             your tracks (read only in practice)
      #   filler.db          the SQLite metadata store
      #   current_track.txt  the "now playing" file
      # Keeping the database on a mounted volume rather than inside the
      # container means play counts and history survive a rebuild, which is
      # what Day 3's crash-recovery testing depends on.
      - ./filler-pool:/app/filler-pool

      # Day 3 structured logs, readable from the host on either OS.
      - ./logs:/app/logs

  # ─────────────────────────────────────────────────────────────────────────
  # Day 4 — Redis: the shared job queue between master and the DELL worker
  # (design spec Section 3.5; detailed-plan Day 4). A Compose service, not a
  # native install — the master stays 100% containerized (working rule 4).
  redis:
    image: redis:7-alpine

    # Password from .env — never a passwordless Redis, even on the private
    # direct-link subnet (Day 4 pitfall). Passed via the container
    # environment and expanded by the shell inside the container, so the
    # value never appears in this committed file or in `docker compose top`
    # argv (the Day 2 stream-key lesson).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'

    # Published on specific interfaces — never 0.0.0.0 (spec v0.4.1):
    #   * LAN/Wi-Fi (192.168.1.210) — the normative worker network since
    #     the 2026-10-04 owner decision: EVERY worker, any OS, reaches
    #     Redis here. requirepass is mandatory; reachable-from-LAN is by
    #     design (see design-spec Section 3.5 networking).
    #   * Legacy direct link (192.168.50.1) — NIC still configured; kept
    #     until the link is physically retired.
    # Binding fails if an interface is down — deliberate, not a bug.
    ports:
      - "192.168.1.210:6379:6379"
      - "192.168.50.1:6379:6379"

    # Day 6: queue persistence. appendonly + a named volume so pending and
    # in-progress jobs survive a Redis restart (the Day 4 skeleton accepted
    # that loss; Day 6's failure-safety goal does not).
    volumes:
      - redis-data:/data
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # Day 6 — queue-reaper: job-lease enforcement + generation-stats recorder
  # (detailed-plan Day 6). Runs on the master, deliberately independent of
  # the DELL link — a dead or disconnected worker cannot leave a job stuck
  # in jobs:in_progress forever, because lease expiry is decided here.
  # restart: always per the plan's pitfall: never a one-off script.
  queue-reaper:
    image: python:3.12-slim
    env_file: .env
    environment:
      # In-network address; .env's REDIS_URL is the DELL-facing one.
      REDIS_URL: redis://redis:6379/0
      STATS_DB: /app/queue/generation_stats.db
    volumes:
      - ./queue:/app/queue
    command: ["python", "/app/queue/reaper.py"]
    restart: always
    depends_on:
      - redis

# Named volumes for Compose services (Day 6: Redis persistence).
volumes:
  redis-data:
